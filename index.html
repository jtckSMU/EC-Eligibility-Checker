<title>EC Eligibility Checker</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f5f6;--surface:#ffffff;--line:#d5dde1;--ink:#14232b;--muted:#56666f;--accent:#0d6a70;--accent-ink:#ffffff;--bad:#b3261e;--logo-bg:#ffffff;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0e1619;--surface:#152126;--line:#2b3d44;--ink:#e4ecee;--muted:#9aaab1;--accent:#4fb8bd;--accent-ink:#06191b;--bad:#f2847b;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.5;display:grid;place-items:center;padding:24px 16px}
[hidden]{display:none!important}
.box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;display:grid;gap:18px}
.logo{justify-self:start;height:52px;width:auto;background:var(--logo-bg);border-radius:8px;padding:4px 8px}
h1{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;font-size:1.6rem;line-height:1.15;margin:0}
p{margin:0;color:var(--muted);font-size:.95rem}
form{display:grid;gap:12px}
label{font-weight:600;font-size:.9rem}
.pw{display:flex;gap:8px}
input[type=password],input[type=text]{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;height:44px;padding:0 12px}
.show{font:inherit;font-size:.85rem;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:0 12px;cursor:pointer}
.chk{display:flex;gap:8px;align-items:center;font-size:.9rem;font-weight:400}
.chk input{accent-color:var(--accent);width:16px;height:16px}
button.go{font:inherit;font-weight:700;height:44px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.go:disabled{opacity:.6;cursor:wait}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--bad);font-weight:600;font-size:.9rem}
.fine{font-size:.8rem}
</style>
</head>

try { Object.keys(localStorage).filter(k => k.indexOf('ecChecker.') === 0).forEach(k => localStorage.removeItem(k)); } catch(_){}
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function derive(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64(P.salt), iterations:P.iter}, base, 256);
}
async function open(raw){
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.data));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
const err = document.getElementById('err'), go = document.getElementById('go'), pw = document.getElementById('pw');
document.getElementById('show').addEventListener('click', e => { const t = pw.type === 'password'; pw.type = t ? 'text' : 'password'; e.target.textContent = t ? 'Hide' : 'Show'; });
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault(); err.hidden = true; go.disabled = true; go.textContent = 'Unlocking…';
  try {
    const raw = await derive(pw.value);
    show(await open(raw));
  } catch(_){ err.hidden = false; go.disabled = false; go.textContent = 'Unlock'; pw.select(); }
});
})();
